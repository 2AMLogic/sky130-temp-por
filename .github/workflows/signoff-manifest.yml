name: signoff-manifest

# Re-run the klt signoff block manifest so the committed tier-verdict
# report can never silently rot: the fresh render must byte-match
# manifests/signoff-report.json, and every artifact a citation recorded a
# hash for must still hash to it. See manifests/README.md for the full
# contract, including why the klt rev is pinned.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  signoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the pinned klt build the committed report was rendered with
        run: |
          python -m pip install --upgrade pip
          pip install "klayout-tools @ git+https://github.com/2AMLogic/klayout-tools@2b1e55e51bb803c082e8857da44687f3e37ebfc0"
          klt version

      - name: Re-run the graded tier-verdict report
        run: |
          set +e
          klt signoff --manifest manifests/sky130-temp-por.json --format json > /tmp/signoff-fresh.json
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
            echo "::error::klt signoff exited $rc (0 = every T1 item met; 3 = rendered, some unmet — expected while the block is mid-progress; 1/2 = broken manifest or usage)"
            exit 1
          fi
          echo "klt signoff rendered the report (exit $rc)"

      - name: Fresh report must byte-match the committed evidence record
        run: |
          if ! diff -u manifests/signoff-report.json /tmp/signoff-fresh.json; then
            echo "::error::the re-rendered signoff report differs from manifests/signoff-report.json — the manifest cited an artifact whose evidence has since changed (or klt's checklist moved). Re-render per manifests/README.md and commit manifest + report together."
            exit 1
          fi
          echo "signoff-report.json is current"

      - name: Cited artifacts must still hash to what their envelopes recorded
        run: python3 manifests/check-citations.py manifests/sky130-temp-por.json

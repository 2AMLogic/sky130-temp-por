name: signoff-manifest

# Re-run the klt signoff block manifest so the committed tier-verdict
# report can never silently rot: the fresh render must byte-match
# manifests/signoff-report.json, and every artifact a citation recorded a
# hash for must still hash to it. See manifests/README.md for the full
# contract, including why the klt rev is pinned.

on:
  push:
    branches: [main]
  pull_request:
  # Merge-queue trial merges: this workflow reports a required context, so it
  # must run on merge_group commits (issue #429, 2AMLogic/2am#7605).
  merge_group:

jobs:
  signoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the pinned klt build the committed report was rendered with
        run: |
          python -m pip install --upgrade pip
          pip install "klayout-tools==0.8.0"
          klt --version
          test "$(klt --version)" = "klt 0.8.0"

      - name: Re-run the graded tier-verdict report
        run: |
          set +e
          klt signoff --manifest manifests/sky130-temp-por.json --format json > /tmp/signoff-fresh.json
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
            echo "::error::klt signoff exited $rc (0 = every T1 item met; 3 = rendered, some unmet — expected while the block is mid-progress; 1/2 = broken manifest or usage)"
            exit 1
          fi
          echo "klt signoff rendered the report (exit $rc)"

      - name: Fresh report must byte-match the committed evidence record
        run: |
          if ! diff -u manifests/signoff-report.json /tmp/signoff-fresh.json; then
            echo "::error::the re-rendered signoff report differs from manifests/signoff-report.json — the manifest cited an artifact whose evidence has since changed (or klt's checklist moved). Re-render per manifests/README.md and commit manifest + report together."
            exit 1
          fi
          echo "signoff-report.json is current"

      - name: The graded T1 verdict must not regress below the committed floor
        env:
          # Raise when an item legitimately becomes `met`. Lowering this is a
          # deliberate, reviewable one-line edit -- which is the whole point:
          # klt re-renders the report, it never re-renders this number.
          # See manifests/README.md ("CI: freshness is enforced, not remembered").
          T1_MET_FLOOR: "7"
        run: |
          python3 -I - /tmp/signoff-fresh.json <<'PY'
          import json, os, sys
          report = json.load(open(sys.argv[1]))
          floor = int(os.environ["T1_MET_FLOOR"])
          count = report["t1_met_count"]
          for item in report.get("items", []):
              if item.get("tier") == "T1" and item.get("reason") is not None:
                  print("T1 item {}: status={} reason={}".format(
                      item.get("id"), item.get("status"), item.get("reason")))
          print("t1_met_count={} floor={}".format(count, floor))
          if count < floor:
              print("::error::t1_met_count is {} but the committed floor is {} -- "
                    "a graded T1 item regressed (see the reason lines above; "
                    "stale_evidence usually means a mis-pinned citation). "
                    "See manifests/README.md.".format(count, floor))
              sys.exit(1)
          PY

      - name: Cited artifacts must hash to their envelopes' records and the manifest pins must match them
        run: python3 manifests/check-citations.py manifests/sky130-temp-por.json

      - name: Re-attest item 10 (repo hygiene) against its committed envelope
        run: |
          klt signoff --attest 10 --inventory manifests/inventories/item-10.json \
            --check manifests/attestations/item-10.json

      - name: Re-attest item 9 (testbenches shipped) against its committed envelope
        run: |
          # The cold-start command needs xschem and the sky130 PDK, which this
          # runner has not. It is marked "local_only": true in the inventory, so
          # --check reports it as "[SKIP] ... (local_only, not run)" and carries
          # the committed outcome -- never as passed -- while still re-hashing
          # every inventoried file and diffing the whole envelope. The step
          # therefore runs unconditionally: no toolchain guard, no silent skip.
          klt signoff --attest 9 --inventory manifests/inventories/item-9.json \
            --check manifests/attestations/item-9.json

      - name: Re-attest item 1 (design sources) against its committed envelope
        run: |
          # Same contract as item 9: the five `python3 design/netlist.py --check`
          # freshness commands are "local_only": true (they need xschem and the
          # PDK), so they report "[SKIP] ... (local_only, not run)" here while the
          # 17 inventoried design sources and netlists are still re-hashed and the
          # envelope is still diffed in full. See manifests/README.md.
          klt signoff --attest 1 --inventory manifests/inventories/item-1.json \
            --check manifests/attestations/item-1.json

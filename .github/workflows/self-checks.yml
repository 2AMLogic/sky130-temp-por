name: self-checks

# Fast, deterministic, stdlib-only checks of the repo's own harness and
# evidence formats. No SPICE, no layout composition, no klt, no xschem.
# See manifests/README.md ("What CI covers") for what is and is not covered.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  self-checks:
    runs-on: ubuntu-latest
    env:
      # Not a default runner variable; the append-only records check reads it
      # to find the pushed-from commit on pushes to main.
      GITHUB_EVENT_BEFORE: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the append-only records check can diff protected
          # sim/*/records/* blobs against the pull_request merge base or the
          # push event's before commit; a depth-1 clone cannot resolve either.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch push-event baseline commit (best effort, force-push edge)
        if: github.event_name == 'push'
        run: |
          # An ordinary push already has its before commit under fetch-depth: 0.
          # This covers a force push whose discarded baseline may have been
          # pruned upstream; if it cannot be fetched, the append-only check
          # below fails visibly with guidance instead of silently passing.
          if [ -n "${GITHUB_EVENT_BEFORE:-}" ] && [ "${GITHUB_EVENT_BEFORE}" != "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags --force origin "${GITHUB_EVENT_BEFORE}" || \
              echo "::warning::could not fetch baseline ${GITHUB_EVENT_BEFORE}; the append-only check will report it as unresolvable"
          fi

      - name: Append-only records checker selftest (add, modify, delete, rename, missing-baseline fixtures)
        run: python3 -I .github/scripts/check_records_append_only.py --selftest

      - name: Simulation records are append-only against the Git baseline
        run: python3 -I .github/scripts/check_records_append_only.py

      - name: Pad-island census unit tests
        run: python3 -m unittest layout/bin/test_pad_island_census.py

      - name: Supply-ramp transition-checker selftest fixtures
        run: python3 sim/supply-ramp-top/ramp_checker.py

      - name: POR-comparator threshold extractor selftest
        run: python3 -I sim/por-comparator-thresholds/threshold_extractor.py

      - name: Iq checker selftest (invalid-waveform rejection, irregular sampling)
        run: python3 -I sim/iq-top/iq_checker.py

      - name: Iq campaign isolation (one bad waveform does not lose the matrix)
        run: python3 -I sim/iq-top/test_campaign_isolation.py

      - name: Iq solver-sensitivity harness (variant reaches deck, invalid waveforms unusable, classification rules)
        run: python3 -I sim/iq-top/test_solver_sensitivity.py

      - name: Re-assertion diagnosis matrix and verdict rules (issue #142)
        run: python3 -I sim/supply-ramp-top/test_reassert_diagnosis.py

      - name: Brown-out checker synthetic verdict cases (16 cases, no records written)
        run: python3 -I sim/brownout-top/brownout_checker.py

      - name: Committed netlists satisfy the pinout invariants
        run: python3 design/check_committed_netlists.py

      - name: Sim experiment.json and records JSON are well-formed
        run: python3 .github/scripts/check_json.py

      - name: Characterization-report coverage checker selftest
        run: python3 -I .github/scripts/check_characterization_coverage.py --selftest

      - name: Characterization report cites every sim experiment with records
        run: python3 -I .github/scripts/check_characterization_coverage.py

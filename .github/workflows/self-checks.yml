name: self-checks

# Fast, deterministic, stdlib-only checks of the repo's own harness and
# evidence formats. No SPICE, no layout composition, no klt, no xschem.
# See manifests/README.md ("What CI covers") for what is and is not covered.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  self-checks:
    runs-on: ubuntu-latest
    env:
      # Not a default runner variable; the append-only evidence check reads it
      # to find the pushed-from commit on pushes to main.
      GITHUB_EVENT_BEFORE: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the append-only evidence check can diff protected
          # sim/*/{records,netlist-snapshots,corners}/* blobs against the pull_request merge base or the
          # push event's before commit; a depth-1 clone cannot resolve either.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch push-event baseline commit (best effort, force-push edge)
        if: github.event_name == 'push'
        run: |
          # An ordinary push already has its before commit under fetch-depth: 0.
          # This covers a force push whose discarded baseline may have been
          # pruned upstream; if it cannot be fetched, the append-only check
          # below fails visibly with guidance instead of silently passing.
          if [ -n "${GITHUB_EVENT_BEFORE:-}" ] && [ "${GITHUB_EVENT_BEFORE}" != "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags --force origin "${GITHUB_EVENT_BEFORE}" || \
              echo "::warning::could not fetch baseline ${GITHUB_EVENT_BEFORE}; the append-only check will report it as unresolvable"
          fi

      - name: Append-only evidence checker selftest (records, snapshots, corners; add, modify, delete, move, baseline fixtures)
        run: python3 -I .github/scripts/check_records_append_only.py --selftest

      - name: Simulation records, netlist snapshots and corner evidence are append-only against the Git baseline
        run: python3 -I .github/scripts/check_records_append_only.py

      - name: Evidence-store helper selftest (fake klt; fail-closed preflight and put, artifact-only manifests)
        run: python3 -I sim/bin/evidence_store.py --selftest

      - name: Artifact manifest checker selftest (schema, artifact-only URIs, tracked-bytes fixtures)
        run: python3 -I .github/scripts/check_artifact_manifests.py --selftest

      - name: Artifact manifests are well-formed, artifact-only and byte-free
        run: python3 -I .github/scripts/check_artifact_manifests.py

      - name: Citation-freshness checker selftest (artifact and LVS compare branches, list-valued evidence entries, object `file` references, unmappable shapes)
        run: python3 -I manifests/test_check_citations.py

      - name: PDK pin enforcement tests (refuse a tree whose revision is not the sim/pdk.json pin)
        run: python3 -I sim/bin/test_pdk_pin.py

      - name: Corner-run batch-backend tests (stub klt, no SPICE, no PDK)
        run: python3 -I sim/bin/test_corner_run_batch.py

      - name: sim_common waveform tests
        run: python3 -I sim/bin/test_sim_common_waveform.py

      - name: sim_common archived-attempt reader tests (stderr error envelope, numeric attempt order)
        run: python3 -I sim/bin/test_sim_common_attempts.py

      - name: sim_common record provenance builder tests (fleet/host tool versions are derived, never literals)
        run: python3 -I sim/bin/test_sim_common_provenance.py

      - name: Solver-sweep record provenance lines (PDK/Tools derived from the run, no literals)
        run: python3 -I sim/temp-core-startup-solver/test_record_provenance.py

      - name: Accuracy-MC `none` negative control is three-state (a corner that compared nothing can never render PASS)
        run: python3 -I sim/temp-core-accuracy-mc/test_none_control.py

      - name: Pad-island census unit tests
        run: python3 -m unittest layout/bin/test_pad_island_census.py

      - name: Supply-ramp transition-checker selftest fixtures
        run: python3 sim/supply-ramp-top/ramp_checker.py

      - name: POR-comparator threshold extractor selftest
        run: python3 -I sim/por-comparator-thresholds/threshold_extractor.py

      - name: Iq checker selftest (invalid-waveform rejection, irregular sampling)
        run: python3 -I sim/iq-top/iq_checker.py

      - name: Iq campaign isolation (one bad waveform does not lose the matrix)
        run: python3 -I sim/iq-top/test_campaign_isolation.py

      - name: Iq solver-sensitivity harness (variant reaches deck, invalid waveforms unusable, classification rules)
        run: python3 -I sim/iq-top/test_solver_sensitivity.py

      - name: Re-assertion diagnosis matrix and verdict rules (issue #142)
        run: python3 -I sim/supply-ramp-top/test_reassert_diagnosis.py

      - name: Brown-out checker synthetic verdict cases (16 cases, no records written)
        run: python3 -I sim/brownout-top/brownout_checker.py

      - name: Brown-out campaign runner unit tests (no simulation, no PDK, no records written)
        run: python3 -I sim/brownout-top/selftest/test_brownout.py

      - name: Glitch checker synthetic verdict cases and campaign unit tests (no simulation, no records written)
        run: |
          python3 -I sim/glitch-top/glitch_checker.py
          python3 -I sim/glitch-top/selftest/test_glitch.py

      - name: Netlist normalize() drops klt's provenance line and nothing else
        run: python3 -I design/test_netlist_normalize.py

      - name: Committed netlists satisfy the pinout invariants
        run: python3 design/check_committed_netlists.py

      - name: Sim experiment.json and records JSON are well-formed
        run: python3 .github/scripts/check_json.py

      - name: Characterization-report coverage checker selftest
        run: python3 -I .github/scripts/check_characterization_coverage.py --selftest

      - name: Characterization report cites every sim experiment with records
        run: python3 -I .github/scripts/check_characterization_coverage.py
